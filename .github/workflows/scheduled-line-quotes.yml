name: Daily LINE Quotes

on:
  schedule:
    # Daily, Taiwan time 08:50.
    - cron: "50 8 * * *"
      timezone: "Asia/Taipei"

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send daily LINE quotes
        run: |
          curl --fail --silent --show-error --max-time 180 \
            -H "X-Schedule-Token: ${{ secrets.SCHEDULE_TOKEN }}" \
            https://line-stock-fee-bot.onrender.com/scheduled-quotes
